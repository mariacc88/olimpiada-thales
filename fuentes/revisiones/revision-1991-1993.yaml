1991-VII/provincial-1:
  clasificar: [[logica], [deduccion], facil]
  enunciado: |
    Un alumno le hizo el siguiente razonamiento a su profesor de Matemáticas:

    *«Resulta que no tengo tiempo para venir a la escuela en todo el año. Verá usted: duermo ocho horas diarias que, sumadas, dan 122 días al año; no hay clase ni los sábados ni los domingos, que son 104 días al año; tenemos 60 días de vacaciones de verano. Necesito tres horas diarias para comer, lo que supone más de 45 días al año; necesito al menos dos horas diarias de recreación, que suman más de 30 días al año».*

    El alumno hizo la siguiente suma:

    | Concepto | Días |
    |---|---|
    | Sueño (8 horas diarias) | 122 |
    | Sábados y domingos | 104 |
    | Vacaciones de verano | 60 |
    | Comidas (3 horas diarias) | 45 |
    | Recreación (2 horas diarias) | 30 |
    | **Total** | **361** |

    *«Ya ve, todo esto solo me deja cuatro días para estar enfermo y para disfrutar del pueblo, por lo que este curso no tenemos ni un solo día de clase».*

    El profesor repasó la suma y vio que no había ningún error y, después de estudiar el problema, encontró por qué no quedaba ningún día al año para asistir a clase. ¿Eres tú capaz de explicar dónde está el error?
