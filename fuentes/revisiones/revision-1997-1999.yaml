1997-XIII/provincial-6:
  clasificar: [[geometria], [], dificil]
  enunciado: |
    Las distancias entre tres ciudades A, B y C son:

    - Entre A y B, 70 km.
    - Entre B y C, 50 km.
    - Entre A y C, 60 km.

    Se quiere construir un hospital con carreteras que lo unan a cada una de las tres ciudades, pero solo se ha adjudicado presupuesto para 84 km de carretera.

    ¿Existe algún punto del interior del triángulo formado por las tres ciudades en el que pueda construirse el hospital?
