1997-XIII/provincial-3:
  clasificar: [[numeros], [ecuaciones], medio]
  enunciado: |
    Tadeo, Anastasio, Indalecio y Maroto son cuatro amigos que, curioseando en una casa abandonada, encontraron una báscula que solo pesaba objetos comprendidos entre 50 y 100 kg. Ninguno de los cuatro superaba los 50 kg de peso y, si se pesaban tres de ellos, siempre superaban los 100 kg, así que se pesaron de dos en dos y estos fueron los pesos:

    - Tadeo y Anastasio pesaron juntos 69 kg.
    - Anastasio e Indalecio pesaron 79 kg.
    - Indalecio y Tadeo pesaron 72 kg.
    - Maroto y Tadeo pesaron 64 kg.

    ¿Sabrías averiguar cuánto pesa cada uno?

    Explica cómo se podría obtener el peso de cada uno si se hubieran podido pesar de 3 en 3.
