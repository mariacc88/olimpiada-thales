1988-IV/provincial-1:
  clasificar: [[numeros], [divisibilidad], facil]
  reemplazar:
    - ["a) N > 3/4 x 100 ; N < 5 x 17 ; N es múltiplo de 10.", "a) $N > \\frac{3}{4} \\cdot 100$; $N < 5 \\cdot 17$; $N$ es múltiplo de 10."]
    - ["b) N > $3^{3}$; N<$2^{5}$ ; N es múltiplo de 7.", "b) $N > 3^3$; $N < 2^5$; $N$ es múltiplo de 7."]
    - ["c) N + M = 9 ; N - M = 11.", "c) $N + M = 9$; $N - M = 11$."]
    - ["d) M es un cuadrado perfecto impar; M < 12 ; M : N = N.", "d) $M$ es un cuadrado perfecto impar; $M < 12$; $M : N = N$."]
    - ["el valor del número N.", "el valor del número $N$."]
