  clasificar: [[logica], [deduccion], medio]
2000-XVI/regional-4:
  clasificar: [[estadistica], [probabilidad], medio]
  enunciado: |
    Elegimos dos cartas al azar (de una baraja española) y las ponemos boca arriba. ¿Qué es más probable?

    - Que haya al menos un rey entre esas dos cartas.
    - Que no haya ningún rey entre esas dos cartas.

    Razona tu respuesta.
  notas: "El enunciado no dice de qué baraja se trata; se ha añadido «baraja española» entre paréntesis como supuesto."
2000-XVI/regional-5:
  clasificar: [[logica], [deduccion], medio]
  enunciado: |
    En un colegio se ha organizado un campeonato de ajedrez. Hay un equipo formado por José, Julia, Juana y Jaime y otro formado por Luis, Lidia, Leonardo y Lorena.

    - El segundo día se enfrentaron José con Lidia y Jaime con Lorena.
    - El tercer día, Juana con Leonardo y Julia con Lidia.
    - El cuarto día, Leonardo con José y Luis con Julia.

    ¿Cuáles fueron las cuatro partidas del primer día si ninguna pareja se enfrentó más de una vez?
