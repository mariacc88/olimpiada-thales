2000-XVI/provincial-6:
  clasificar: [[logica, numeros], [deduccion, cifras], medio]
  enunciado: |
    Tras el recuadro se oculta un número de tres cifras que tienes que adivinar con ayuda de las pistas que te damos a continuación. Por cada número que aparece en la columna de la izquierda:

    - Anotamos tantos **hundidos** como cifras tenga en común con el número oculto y en la misma posición.
    - Anotamos tantos **tocados** como cifras tenga en común con el número oculto pero en distinta posición.

    Por ejemplo, si el número oculto fuese **287**, las pistas que nos darían cuando nosotros dijéramos los números 847, 378 y 123 serían:

    | Número | Tocados | Hundidos |
    |---|---|---|
    | 847 | 1 | 1 |
    | 378 | 2 | 0 |
    | 123 | 1 | 0 |

    Pues bien, debes adivinar el número oculto (**???**) en el caso siguiente:

    | Número | Tocados | Hundidos |
    |---|---|---|
    | 437 | 1 | 1 |
    | 572 | 2 | 0 |
    | 372 | 1 | ? |
  notas: "DATO PERDIDO: en la web falta el número de hundidos de la última pista (372)."
