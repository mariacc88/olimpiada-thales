2001-XVII/provincial-1:
  clasificar: [[numeros], [proporcionalidad], facil]
  enunciado: |
    Hay una campaña publicitaria en todas las ciudades para ayudarnos a hacer los cálculos de conversión de pesetas a euros, en la que se nos indica:

    **La clave es: 6 euros = 1000 pesetas.**

    Utiliza esta aproximación para completar las siguientes equivalencias:

    | Euros | Pesetas |
    |---|---|
    | 18 € | … |
    | 5,40 € | … |
    | 2,40 € | … |
    | … | 250 ptas |
    | … | 600 ptas |
    | … | 5000 ptas |
