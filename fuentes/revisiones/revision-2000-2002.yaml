2001-XVII/provincial-4:
  clasificar: [[logica], [deduccion], medio]
  enunciado: |
    Bernardo, Carmen y Antonio son tres buenos amigos cuyas edades desconocemos. Sin embargo, se sabe que exactamente una de las siguientes frases es falsa:

    1. Antonio es mayor que Bernardo.
    2. Carmen es más joven que Bernardo.
    3. La suma de las edades de Bernardo y Carmen es el doble de la edad de Antonio.
    4. Carmen es mayor que Antonio.

    ¿Quién es el más joven de los tres?
2001-XVII/provincial-6:
  clasificar: [[geometria], [areas], medio]
  enunciado: |
    Determina la superficie de un trapecio isósceles cuyas bases miden 12 y 20 cm y cuyas diagonales son perpendiculares.

    Pista: para calcular la superficie del trapecio puedes utilizar la fórmula

    $$S = \frac{(B + b) \cdot h}{2},$$

    donde $B$ es la base mayor, $b$ la base menor y $h$ la altura.
